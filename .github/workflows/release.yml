name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate Quality & Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches version.py
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_VERSION="${TAG#v}"
          APP_VERSION=$(python3 -c "import version; print(version.__version__)")
          echo "Release tag: $TAG"
          echo "Expected version: $EXPECTED_VERSION"
          echo "App version: $APP_VERSION"
          if [ "$EXPECTED_VERSION" != "$APP_VERSION" ]; then
            echo "ERROR: Release tag ($TAG) does not match version.py ($APP_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff "bandit[toml]" pip-audit

      - name: Run Ruff linter
        run: |
          ruff check .

      - name: Run Bandit security scanner
        run: |
          bandit -c pyproject.toml -r .

      - name: Run pip-audit vulnerability scan
        run: |
          pip-audit -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

  build-windows:
    name: Build Windows bundle
    needs: validate
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bundle
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Verify checksum
        run: |
          python -c "import glob, hashlib, os; f = glob.glob('dist/*.zip')[0]; h, n = open(f + '.sha256').read().split(); assert n == os.path.basename(f) and h == hashlib.sha256(open(f, 'rb').read()).hexdigest(); print(n, 'OK')"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: FileSuite-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  build-macos:
    name: Build macOS bundle (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build bundle
        run: ./packaging/macos/build.sh

      - name: Verify checksum
        run: |
          cd dist
          shasum -a 256 -c *.dmg.sha256

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: FileSuite-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  build-release:
    name: Build & Publish Release
    needs: [validate, build-windows, build-macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build standalone executable
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify checksum
        run: |
          cd dist
          sha256sum -c FileSuite.sha256

      - name: Download Windows bundle
        uses: actions/download-artifact@v4
        with:
          name: FileSuite-windows-x64
          path: dist

      - name: Download macOS bundles
        uses: actions/download-artifact@v4
        with:
          pattern: FileSuite-macos-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/FileSuite
            dist/FileSuite.sha256
            dist/FileSuite-windows-x64-*.zip
            dist/FileSuite-windows-x64-*.zip.sha256
            dist/FileSuite-macos-*.dmg
            dist/FileSuite-macos-*.dmg.sha256
          generate_release_notes: true

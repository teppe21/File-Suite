name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate Quality & Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches version.py
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_VERSION="${TAG#v}"
          APP_VERSION=$(python3 -c "import version; print(version.__version__)")
          echo "Release tag: $TAG"
          echo "Expected version: $EXPECTED_VERSION"
          echo "App version: $APP_VERSION"
          if [ "$EXPECTED_VERSION" != "$APP_VERSION" ]; then
            echo "ERROR: Release tag ($TAG) does not match version.py ($APP_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff "bandit[toml]" pip-audit

      - name: Run Ruff linter
        run: |
          ruff check .

      - name: Run Bandit security scanner
        run: |
          bandit -c pyproject.toml -r .

      - name: Run pip-audit vulnerability scan
        run: |
          pip-audit -r requirements.txt

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

  build-release:
    name: Build & Publish Release
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build standalone executable
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify checksum
        run: |
          cd dist
          sha256sum -c FileSuite.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FileSuite
            dist/FileSuite.sha256
          generate_release_notes: true

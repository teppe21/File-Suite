name: macOS Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check Tk
        run: |
          python -c "import tkinter, platform; print(tkinter.TkVersion, tkinter.Tcl().eval('info patchlevel'), platform.machine(), platform.mac_ver()[0]); assert tkinter.TkVersion >= 8.6"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          FILESUITE_REAL_TRASH_TEST: "1"
        run: |
          python -m unittest discover -s tests -v

      - name: Run pip-audit vulnerability scan
        if: matrix.python-version == '3.12'
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Smoke test
        run: |
          python main.py &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "main.py exited within 5 seconds" >&2
            exit 1
          fi
          kill "$pid"

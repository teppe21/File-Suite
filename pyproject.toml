[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    ".venv",
    "venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "UP",
    "B",
    "S",
]
ignore = [
    "E501",
    "S603",  # Subprocess call with validated arguments
    "S607",  # Starting process with a partial path (zenity / kdialog detection)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]  # Asserts and mock /tmp paths in unit tests
